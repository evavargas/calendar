spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # Same-origin via Vercel reverse proxy (not Cloud Run host)
            redirect-uri: ${GOOGLE_LOGIN_REDIRECT_URI}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # Lax is enough when the browser only talks to the Vercel origin
        same-site: lax
        secure: true

kairo:
  auth:
    mock-enabled: false
  cors:
    allowed-origins: ${CORS_ORIGINS}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    calendar-redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI}
  token-secret: ${KAIRO_TOKEN_SECRET}
