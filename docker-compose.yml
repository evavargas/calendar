services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kairo
      POSTGRES_USER: kairo
      POSTGRES_PASSWORD: kairo
    ports:
      - "5432:5432"
    volumes:
      - kairo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairo -d kairo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kairo_pg:
